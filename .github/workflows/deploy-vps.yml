name: Deploy TaskFlow (NonAzure lane, VPS)

# NonAzure lane release (D-060, D-036): five shared host images plus React and Uno static images, brought up
# on one VPS by Docker Compose behind Caddy. Manual only - a VPS deploy is deliberate work.
#
# Secrets (names only; documented in deploy/compose/README.md):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, CADDY_DOMAIN, REACT_UI_DOMAIN, UNO_UI_DOMAIN, NUGET_PAT

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        options: [deploy, rollback]
        default: deploy
      commit_sha:
        description: Full green commit SHA. Required for deploy; ignored for rollback.
        type: string
        required: false

# Never cancel a deploy in flight: a half-applied compose stack is worse than paying for the run.
concurrency:
  group: taskflow-deploy-vps
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  packages: write

env:
  REMOTE_DIR: taskflow
  COMPOSE: docker compose -f docker-compose.yml

jobs:
  validate-entry:
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.resolve.outputs.operation }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve operation and exact commit
        id: resolve
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          operation="${OPERATION:-deploy}"
          [[ "$operation" == "deploy" || "$operation" == "rollback" ]] || {
            echo "::error::operation must be deploy or rollback"; exit 1;
          }
          if [[ "$operation" == "rollback" ]]; then
            echo "operation=rollback" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          requested="$REQUESTED_SHA"
          [[ -n "$requested" ]] || { echo "::error::commit_sha is required for a manual deploy"; exit 1; }
          git fetch origin main
          sha=$(git rev-parse "${requested}^{commit}")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::$sha is not reachable from origin/main"; exit 1;
          }
          echo "operation=deploy" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require successful CI for exact deploy SHA
        if: steps.resolve.outputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          checks=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs" -f per_page=100)
          count=$(jq '[.check_runs[] | select(.name == "build-and-test" and .conclusion == "success")] | length' <<< "$checks")
          [[ "$count" -gt 0 ]] || { echo "::error::$TARGET_SHA has no successful build-and-test check"; exit 1; }
          blockers=$(jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("failure", "cancelled", "timed_out", "action_required")))] | length' <<< "$checks")
          [[ "$blockers" -eq 0 ]] || { echo "::error::$TARGET_SHA has failed required checks"; exit 1; }

  build-release:
    if: needs.validate-entry.outputs.operation == 'deploy'
    needs: validate-entry
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ needs.validate-entry.outputs.sha }}
      include-static-ui: true
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy:
    if: needs.validate-entry.outputs.operation == 'deploy'
    needs: [validate-entry, build-release]
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-entry.outputs.sha }}
      # Plain ssh with a pinned known_hosts, not a third-party action: this step holds a key that can run
      # docker on the host, so the fewer third parties in that path the better. StrictHostKeyChecking stays
      # on, which is the entire point of the VPS_KNOWN_HOSTS secret.
      - name: Configure ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || {
            echo "::error::VPS_SSH_KEY and VPS_KNOWN_HOSTS are required"; exit 1;
          }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host taskflow-vps
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 30
          CFG
          {
            echo "  HostName ${{ secrets.VPS_HOST }}"
            echo "  User ${{ secrets.VPS_USER }}"
          } >> ~/.ssh/config
      - name: Ship compose assets and the digest pins
        env:
          GATEWAY: ${{ needs.build-release.outputs.gateway-image }}
          API: ${{ needs.build-release.outputs.api-image }}
          SCHEDULER: ${{ needs.build-release.outputs.scheduler-image }}
          MIGRATOR: ${{ needs.build-release.outputs.migrator-image }}
          BLAZOR: ${{ needs.build-release.outputs.blazor-image }}
          REACT: ${{ needs.build-release.outputs.react-image }}
          UNO: ${{ needs.build-release.outputs.uno-image }}
        run: |
          set -euo pipefail
          for image in "$GATEWAY" "$API" "$SCHEDULER" "$MIGRATOR" "$BLAZOR" "$REACT" "$UNO"; do
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Refusing to deploy an image that is not digest-pinned: $image"; exit 1;
            }
          done
          cat > images.env <<ENV
          TASKFLOW_GATEWAY_IMAGE=$GATEWAY
          TASKFLOW_API_IMAGE=$API
          TASKFLOW_SCHEDULER_IMAGE=$SCHEDULER
          TASKFLOW_MIGRATOR_IMAGE=$MIGRATOR
          TASKFLOW_BLAZOR_IMAGE=$BLAZOR
          TASKFLOW_REACT_IMAGE=$REACT
          TASKFLOW_UNO_IMAGE=$UNO
          ENV
          ssh taskflow-vps "mkdir -p ~/${REMOTE_DIR}/pgbouncer"
          scp deploy/compose/docker-compose.yml deploy/compose/Caddyfile images.env \
            "taskflow-vps:~/${REMOTE_DIR}/"
          scp deploy/compose/.env.example "taskflow-vps:~/${REMOTE_DIR}/.env.base.example"
          scp deploy/compose/pgbouncer/pgbouncer.ini deploy/compose/pgbouncer/userlist.txt.example \
            "taskflow-vps:~/${REMOTE_DIR}/pgbouncer/"
      - name: Pull and bring the stack up
        run: |
          set -euo pipefail
          # .env.base holds the operator-managed settings; .env is that plus the digest pins, because
          # compose interpolates image names only from .env in the project directory.
          ssh taskflow-vps "set -euo pipefail
            cd ~/${REMOTE_DIR}
            [[ -f .env.base ]] || {
              echo 'Missing operator-managed .env.base. Copy .env.base.example to .env.base, replace every CHANGE_ME value, chmod 600, then rerun.' >&2
              exit 1
            }
            if grep -Eq '^[A-Za-z0-9_]+=[^#]*CHANGE_ME_' .env.base; then
              echo 'Refusing deployment while .env.base contains a CHANGE_ME value.' >&2
              exit 1
            fi
            if grep -Eq '^TASKFLOW_[A-Z0-9_]+_IMAGE=' .env.base; then
              echo 'Remove image variables from .env.base; images.env is workflow-managed.' >&2
              exit 1
            fi
            if grep -q '^COMPOSE_PROFILES=' .env.base; then
              echo 'Remove COMPOSE_PROFILES from .env.base; it is derived from provider settings.' >&2
              exit 1
            fi
            if grep -q '^OTEL_EXPORTER_OTLP_ENDPOINT=' .env.base; then
              echo 'Remove OTEL_EXPORTER_OTLP_ENDPOINT from .env.base; the strict NonAzure lane owns the OpenObserve endpoint.' >&2
              exit 1
            fi
            [[ "\$(grep -Ec '^OPENOBSERVE_RETENTION_DAYS=' .env.base)" -eq 1 ]] || {
              echo 'Set exactly one OPENOBSERVE_RETENTION_DAYS in .env.base.' >&2
              exit 1
            }
            openobserve_retention=\$(sed -n 's/^OPENOBSERVE_RETENTION_DAYS=//p' .env.base)
            if [[ ! "\$openobserve_retention" =~ ^[0-9]+$ ]] || (( 10#\$openobserve_retention < 3 )); then
              echo 'OPENOBSERVE_RETENTION_DAYS must be an integer greater than or equal to 3.' >&2
              exit 1
            fi
            legacy_lgtm_volumes=\$(docker volume ls --filter label=com.docker.compose.project=taskflow --filter label=com.docker.compose.volume=lgtm-data --format '{{.Name}}')
            if [[ -n "\$legacy_lgtm_volumes" ]]; then
              echo 'Legacy LGTM data volume found. Back it up or explicitly discard it using the upgrade procedure in deploy/compose/README.md, then rerun.' >&2
              printf '%s\n' "\$legacy_lgtm_volumes" >&2
              exit 1
            fi
            [[ \"\$(grep -Ec '^ReadModel__Provider=' .env.base)\" -eq 1 ]] || {
              echo 'Set exactly one ReadModel__Provider in .env.base.' >&2
              exit 1
            }
            [[ \"\$(grep -Ec '^Database__PostgreSql__PoolerMode=' .env.base)\" -eq 1 ]] || {
              echo 'Set exactly one Database__PostgreSql__PoolerMode in .env.base.' >&2
              exit 1
            }
            cp images.env images.env.current
            compose_profiles=''
            if grep -qx 'ReadModel__Provider=MongoDb' .env.base; then
              compose_profiles=mongo
            elif grep -Eqx 'ReadModel__Provider=(PostgreSqlJsonb|Relational)' .env.base; then
              :
            else
              echo 'ReadModel__Provider must be PostgreSqlJsonb, MongoDb, or deprecated Relational.' >&2
              exit 1
            fi
            if grep -qx 'Database__PostgreSql__PoolerMode=Transaction' .env.base; then
              if [[ -n \"\$compose_profiles\" ]]; then
                compose_profiles=\"\${compose_profiles},pooler\"
              else
                compose_profiles=pooler
              fi
            elif ! grep -Eqx 'Database__PostgreSql__PoolerMode=(|None)' .env.base; then
              echo 'Database__PostgreSql__PoolerMode must be empty, None, or Transaction.' >&2
              exit 1
            fi
            { cat .env.base; printf '\n'; if [[ -n \"\$compose_profiles\" ]]; then printf 'COMPOSE_PROFILES=%s\n' \"\$compose_profiles\"; fi; cat images.env; } > .env
            chmod 600 .env .env.base
            ${COMPOSE} config -q
            ${COMPOSE} pull
            ${COMPOSE} up -d --wait --remove-orphans
            ${COMPOSE} ps"
          ssh taskflow-vps "TASKFLOW_REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"$TASKFLOW_REMOTE_DIR"
          read_setting() {
            local name="$1"
            [[ "$(grep -Ec "^${name}=" .env.base)" -eq 1 ]] || {
              echo "Set exactly one ${name} in .env.base." >&2; exit 1;
            }
            local value
            value=$(sed -n "s/^${name}=//p" .env.base)
            [[ -n "$value" ]] || { echo "${name} must not be empty." >&2; exit 1; }
            printf '%s' "$value"
          }
          openobserve_org=$(read_setting OPENOBSERVE_ORGANIZATION)
          openobserve_stream=$(read_setting OPENOBSERVE_STREAM_NAME)
          openobserve_basic_credential=$(read_setting OPENOBSERVE_OTLP_BASIC_CREDENTIAL)
          echo "::add-mask::${openobserve_basic_credential}"
          case "$openobserve_org" in ''|*[!A-Za-z0-9_-]*) echo 'OPENOBSERVE_ORGANIZATION contains unsupported URL characters.' >&2; exit 1;; esac
          case "$openobserve_stream" in ''|*[!A-Za-z0-9_-]*) echo 'OPENOBSERVE_STREAM_NAME contains unsupported URL characters.' >&2; exit 1;; esac
          openobserve_decoded=$(printf '%s' "$openobserve_basic_credential" | base64 --decode 2>/dev/null) || {
            echo 'OPENOBSERVE_OTLP_BASIC_CREDENTIAL must be valid base64.' >&2; exit 1;
          }
          case "$openobserve_decoded" in "$openobserve_org":o2oi_?*) ;; *)
            echo 'OPENOBSERVE_OTLP_BASIC_CREDENTIAL must encode organization:o2oi_token for the configured organization.' >&2; exit 1;;
          esac
          unset openobserve_decoded
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:5080/healthz > /dev/null
          openobserve_id=$(docker compose -f docker-compose.yml ps -q openobserve)
          [[ -n "$openobserve_id" ]] || { echo 'OpenObserve container was not found.' >&2; exit 1; }
          docker run --rm --network "container:${openobserve_id}" \
            ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:554d71c82659e4dda1269004b0ea0731755b7e153e2ba909c9b3555883b4b623 \
            logs --logs 1 --service taskflow-deploy-smoke --body 'TaskFlow deployment observability smoke' \
            --otlp-endpoint 127.0.0.1:5081 --otlp-insecure \
            --otlp-header "Authorization=\"Basic ${openobserve_basic_credential}\"" \
            --otlp-header "organization=\"${openobserve_org}\"" \
            --otlp-header "stream-name=\"${openobserve_stream}\""
          docker run --rm --network "container:${openobserve_id}" \
            ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:554d71c82659e4dda1269004b0ea0731755b7e153e2ba909c9b3555883b4b623 \
            traces --traces 1 --service taskflow-deploy-smoke \
            --otlp-endpoint 127.0.0.1:5081 --otlp-insecure \
            --otlp-header "Authorization=\"Basic ${openobserve_basic_credential}\"" \
            --otlp-header "organization=\"${openobserve_org}\"" \
            --otlp-header "stream-name=\"${openobserve_stream}\""
          unset openobserve_basic_credential
          REMOTE
      - name: Verify public readiness and one CRUD round trip
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          REACT_UI_DOMAIN: ${{ secrets.REACT_UI_DOMAIN }}
          UNO_UI_DOMAIN: ${{ secrets.UNO_UI_DOMAIN }}
        run: |
          set -euo pipefail
          base="https://${CADDY_DOMAIN}"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${base}/healthz/ready" > /dev/null
          # Scaffold auth succeeds every request with a fixed identity (D-002), so the smoke needs no
          # header - the same convention infra/scripts/Invoke-DeploymentSmoke.ps1 relies on.
          created=$(curl -fsS -X POST "${base}/api/v1/task-items" -H 'Content-Type: application/json' \
            -d "{\"item\":{\"title\":\"vps-smoke-${GITHUB_SHA:0:12}\",\"priority\":\"Medium\"}}")
          id=$(jq -er '.item.id' <<< "$created")
          curl -fsS "${base}/api/v1/task-items/${id}" | jq -er --arg id "$id" 'select(.item.id == $id)' > /dev/null
          curl -fsS -X DELETE "${base}/api/v1/task-items/${id}" > /dev/null
          check_ui() {
            local domain="$1"
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${domain}/" > /dev/null
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${domain}/app-config.json" \
              | jq -e --arg gateway "$base" '.gatewayBaseUrl == $gateway' > /dev/null
          }
          check_ui "$REACT_UI_DOMAIN"
          check_ui "$UNO_UI_DOMAIN"
          echo "VPS readiness and create/read/delete smoke passed."

  record-release:
    if: needs.validate-entry.outputs.operation == 'deploy'
    needs: [validate-entry, build-release, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create validated current release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate-entry.outputs.sha }}
          GATEWAY: ${{ needs.build-release.outputs.gateway-image }}
          API: ${{ needs.build-release.outputs.api-image }}
          SCHEDULER: ${{ needs.build-release.outputs.scheduler-image }}
          MIGRATOR: ${{ needs.build-release.outputs.migrator-image }}
          BLAZOR: ${{ needs.build-release.outputs.blazor-image }}
          REACT: ${{ needs.build-release.outputs.react-image }}
          UNO: ${{ needs.build-release.outputs.uno-image }}
        run: |
          set -euo pipefail
          candidate=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f name=taskflow-release-manifest-vps -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          previous=null
          if [[ -n "$candidate" ]]; then
            mkdir -p previous
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate}/zip" > previous.zip
            unzip -q previous.zip -d previous
            if pwsh -File ./infra/scripts/Test-ReleaseManifest.ps1 -Path previous/release-manifest.json -ImagesOnly -ExpectedSchemaVersion 2; then
              previous=$candidate
            else
              echo "Skipping incompatible v1 release manifest $candidate as rollback target."
            fi
          fi
          jq -n --arg sha "$SHA" --arg gateway "$GATEWAY" --arg api "$API" --arg scheduler "$SCHEDULER" --arg migrator "$MIGRATOR" --arg blazor "$BLAZOR" --arg react "$REACT" --arg uno "$UNO" \
            --argjson previous "$previous" \
            '{schemaVersion:2,operation:"deploy",commitSha:$sha,images:{gateway:$gateway,api:$api,scheduler:$scheduler,migrator:$migrator,blazor:$blazor,react:$react,uno:$uno},previousManifestArtifactId:$previous}' > release-manifest.json
          pwsh -File ./infra/scripts/Test-ReleaseManifest.ps1 -Path release-manifest.json -ImagesOnly -ExpectedSchemaVersion 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskflow-release-manifest-vps
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

  resolve-rollback:
    if: needs.validate-entry.outputs.operation == 'rollback'
    needs: validate-entry
    runs-on: ubuntu-latest
    outputs:
      current-id: ${{ steps.release.outputs.current-id }}
      sha: ${{ steps.release.outputs.sha }}
      gateway: ${{ steps.release.outputs.gateway }}
      api: ${{ steps.release.outputs.api }}
      scheduler: ${{ steps.release.outputs.scheduler }}
      migrator: ${{ steps.release.outputs.migrator }}
      blazor: ${{ steps.release.outputs.blazor }}
      react: ${{ steps.release.outputs.react }}
      uno: ${{ steps.release.outputs.uno }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        name: Resolve authoritative previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" -f name=taskflow-release-manifest-vps -f per_page=100 \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          [[ -n "$current" ]] || { echo "::error::No current release manifest"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${current}/zip" > current.zip
          unzip -q current.zip -d current
          pwsh -File ./infra/scripts/Test-ReleaseManifest.ps1 -Path current/release-manifest.json -ImagesOnly -ExpectedSchemaVersion 2
          previous=$(jq -r '.previousManifestArtifactId // empty' current/release-manifest.json)
          [[ -n "$previous" ]] || { echo "::error::No previous release manifest"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${previous}/zip" > previous.zip
          unzip -q previous.zip -d previous
          pwsh -File ./infra/scripts/Test-ReleaseManifest.ps1 -Path previous/release-manifest.json -ImagesOnly -ExpectedSchemaVersion 2
          m=previous/release-manifest.json
          echo "current-id=$current" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .commitSha "$m")" >> "$GITHUB_OUTPUT"
          for key in gateway api scheduler migrator blazor react uno; do echo "$key=$(jq -r ".images.$key" "$m")" >> "$GITHUB_OUTPUT"; done

  rollback:
    if: needs.validate-entry.outputs.operation == 'rollback'
    needs: [validate-entry, resolve-rollback]
    runs-on: ubuntu-latest
    environment: vps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || {
            echo "::error::VPS_SSH_KEY and VPS_KNOWN_HOSTS are required"; exit 1;
          }
          mkdir -m 700 -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CFG'
          Host taskflow-vps
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 30
          CFG
          {
            echo "  HostName ${{ secrets.VPS_HOST }}"
            echo "  User ${{ secrets.VPS_USER }}"
          } >> ~/.ssh/config
      - name: Restore the recorded images without rebuilding or migrating
        env:
          GATEWAY: ${{ needs.resolve-rollback.outputs.gateway }}
          API: ${{ needs.resolve-rollback.outputs.api }}
          SCHEDULER: ${{ needs.resolve-rollback.outputs.scheduler }}
          MIGRATOR: ${{ needs.resolve-rollback.outputs.migrator }}
          BLAZOR: ${{ needs.resolve-rollback.outputs.blazor }}
          REACT: ${{ needs.resolve-rollback.outputs.react }}
          UNO: ${{ needs.resolve-rollback.outputs.uno }}
        run: |
          set -euo pipefail
          # Application-only rollback. Database migrations remain forward-applied and must be backward
          # compatible - the migrator image is restored, not re-run against an older schema.
          for image in "$GATEWAY" "$API" "$SCHEDULER" "$MIGRATOR" "$BLAZOR" "$REACT" "$UNO"; do
            [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Recorded image is not digest-pinned: $image"; exit 1;
            }
          done
          cat > images.env <<ENV
          TASKFLOW_GATEWAY_IMAGE=$GATEWAY
          TASKFLOW_API_IMAGE=$API
          TASKFLOW_SCHEDULER_IMAGE=$SCHEDULER
          TASKFLOW_MIGRATOR_IMAGE=$MIGRATOR
          TASKFLOW_BLAZOR_IMAGE=$BLAZOR
          TASKFLOW_REACT_IMAGE=$REACT
          TASKFLOW_UNO_IMAGE=$UNO
          ENV
          scp images.env "taskflow-vps:~/${REMOTE_DIR}/images.env"
          ssh taskflow-vps "set -euo pipefail
            cd ~/${REMOTE_DIR}
            [[ -f .env.base ]] || { echo 'Missing operator-managed .env.base.' >&2; exit 1; }
            if grep -Eq '^[A-Za-z0-9_]+=[^#]*CHANGE_ME_' .env.base; then
              echo 'Refusing rollback while .env.base contains a CHANGE_ME value.' >&2
              exit 1
            fi
            if grep -Eq '^TASKFLOW_[A-Z0-9_]+_IMAGE=' .env.base; then
              echo 'Remove image variables from .env.base; images.env is workflow-managed.' >&2
              exit 1
            fi
            if grep -q '^COMPOSE_PROFILES=' .env.base; then
              echo 'Remove COMPOSE_PROFILES from .env.base; it is derived from provider settings.' >&2
              exit 1
            fi
            if grep -q '^OTEL_EXPORTER_OTLP_ENDPOINT=' .env.base; then
              echo 'Remove OTEL_EXPORTER_OTLP_ENDPOINT from .env.base; the strict NonAzure lane owns the OpenObserve endpoint.' >&2
              exit 1
            fi
            [[ "\$(grep -Ec '^OPENOBSERVE_RETENTION_DAYS=' .env.base)" -eq 1 ]] || {
              echo 'Set exactly one OPENOBSERVE_RETENTION_DAYS in .env.base.' >&2
              exit 1
            }
            openobserve_retention=\$(sed -n 's/^OPENOBSERVE_RETENTION_DAYS=//p' .env.base)
            if [[ ! "\$openobserve_retention" =~ ^[0-9]+$ ]] || (( 10#\$openobserve_retention < 3 )); then
              echo 'OPENOBSERVE_RETENTION_DAYS must be an integer greater than or equal to 3.' >&2
              exit 1
            fi
            legacy_lgtm_volumes=\$(docker volume ls --filter label=com.docker.compose.project=taskflow --filter label=com.docker.compose.volume=lgtm-data --format '{{.Name}}')
            if [[ -n "\$legacy_lgtm_volumes" ]]; then
              echo 'Legacy LGTM data volume found. Back it up or explicitly discard it using the upgrade procedure in deploy/compose/README.md, then rerun.' >&2
              printf '%s\n' "\$legacy_lgtm_volumes" >&2
              exit 1
            fi
            [[ \"\$(grep -Ec '^ReadModel__Provider=' .env.base)\" -eq 1 ]] || {
              echo 'Set exactly one ReadModel__Provider in .env.base.' >&2
              exit 1
            }
            [[ \"\$(grep -Ec '^Database__PostgreSql__PoolerMode=' .env.base)\" -eq 1 ]] || {
              echo 'Set exactly one Database__PostgreSql__PoolerMode in .env.base.' >&2
              exit 1
            }
            compose_profiles=''
            if grep -qx 'ReadModel__Provider=MongoDb' .env.base; then
              compose_profiles=mongo
            elif grep -Eqx 'ReadModel__Provider=(PostgreSqlJsonb|Relational)' .env.base; then
              :
            else
              echo 'ReadModel__Provider must be PostgreSqlJsonb, MongoDb, or deprecated Relational.' >&2
              exit 1
            fi
            if grep -qx 'Database__PostgreSql__PoolerMode=Transaction' .env.base; then
              if [[ -n \"\$compose_profiles\" ]]; then
                compose_profiles=\"\${compose_profiles},pooler\"
              else
                compose_profiles=pooler
              fi
            elif ! grep -Eqx 'Database__PostgreSql__PoolerMode=(|None)' .env.base; then
              echo 'Database__PostgreSql__PoolerMode must be empty, None, or Transaction.' >&2
              exit 1
            fi
            { cat .env.base; printf '\n'; if [[ -n \"\$compose_profiles\" ]]; then printf 'COMPOSE_PROFILES=%s\n' \"\$compose_profiles\"; fi; cat images.env; } > .env
            chmod 600 .env
            ${COMPOSE} config -q
            ${COMPOSE} pull
            ${COMPOSE} up -d --wait --remove-orphans"
          ssh taskflow-vps "TASKFLOW_REMOTE_DIR='${REMOTE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/"$TASKFLOW_REMOTE_DIR"
          read_setting() {
            local name="$1"
            [[ "$(grep -Ec "^${name}=" .env.base)" -eq 1 ]] || {
              echo "Set exactly one ${name} in .env.base." >&2; exit 1;
            }
            local value
            value=$(sed -n "s/^${name}=//p" .env.base)
            [[ -n "$value" ]] || { echo "${name} must not be empty." >&2; exit 1; }
            printf '%s' "$value"
          }
          openobserve_org=$(read_setting OPENOBSERVE_ORGANIZATION)
          openobserve_stream=$(read_setting OPENOBSERVE_STREAM_NAME)
          openobserve_basic_credential=$(read_setting OPENOBSERVE_OTLP_BASIC_CREDENTIAL)
          echo "::add-mask::${openobserve_basic_credential}"
          case "$openobserve_org" in ''|*[!A-Za-z0-9_-]*) echo 'OPENOBSERVE_ORGANIZATION contains unsupported URL characters.' >&2; exit 1;; esac
          case "$openobserve_stream" in ''|*[!A-Za-z0-9_-]*) echo 'OPENOBSERVE_STREAM_NAME contains unsupported URL characters.' >&2; exit 1;; esac
          openobserve_decoded=$(printf '%s' "$openobserve_basic_credential" | base64 --decode 2>/dev/null) || {
            echo 'OPENOBSERVE_OTLP_BASIC_CREDENTIAL must be valid base64.' >&2; exit 1;
          }
          case "$openobserve_decoded" in "$openobserve_org":o2oi_?*) ;; *)
            echo 'OPENOBSERVE_OTLP_BASIC_CREDENTIAL must encode organization:o2oi_token for the configured organization.' >&2; exit 1;;
          esac
          unset openobserve_decoded
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:5080/healthz > /dev/null
          openobserve_id=$(docker compose -f docker-compose.yml ps -q openobserve)
          [[ -n "$openobserve_id" ]] || { echo 'OpenObserve container was not found.' >&2; exit 1; }
          docker run --rm --network "container:${openobserve_id}" \
            ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:554d71c82659e4dda1269004b0ea0731755b7e153e2ba909c9b3555883b4b623 \
            logs --logs 1 --service taskflow-rollback-smoke --body 'TaskFlow rollback observability smoke' \
            --otlp-endpoint 127.0.0.1:5081 --otlp-insecure \
            --otlp-header "Authorization=\"Basic ${openobserve_basic_credential}\"" \
            --otlp-header "organization=\"${openobserve_org}\"" \
            --otlp-header "stream-name=\"${openobserve_stream}\""
          docker run --rm --network "container:${openobserve_id}" \
            ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen@sha256:554d71c82659e4dda1269004b0ea0731755b7e153e2ba909c9b3555883b4b623 \
            traces --traces 1 --service taskflow-rollback-smoke \
            --otlp-endpoint 127.0.0.1:5081 --otlp-insecure \
            --otlp-header "Authorization=\"Basic ${openobserve_basic_credential}\"" \
            --otlp-header "organization=\"${openobserve_org}\"" \
            --otlp-header "stream-name=\"${openobserve_stream}\""
          unset openobserve_basic_credential
          REMOTE
      - name: Verify rollback readiness and one CRUD round trip
        env:
          CADDY_DOMAIN: ${{ secrets.CADDY_DOMAIN }}
          REACT_UI_DOMAIN: ${{ secrets.REACT_UI_DOMAIN }}
          UNO_UI_DOMAIN: ${{ secrets.UNO_UI_DOMAIN }}
        run: |
          set -euo pipefail
          base="https://${CADDY_DOMAIN}"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${base}/healthz/ready" > /dev/null
          created=$(curl -fsS -X POST "${base}/api/v1/task-items" -H 'Content-Type: application/json' \
            -d '{"item":{"title":"vps-rollback-smoke","priority":"Medium"}}')
          id=$(jq -er '.item.id' <<< "$created")
          curl -fsS -X DELETE "${base}/api/v1/task-items/${id}" > /dev/null
          check_ui() {
            local domain="$1"
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${domain}/" > /dev/null
            curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${domain}/app-config.json" \
              | jq -e --arg gateway "$base" '.gatewayBaseUrl == $gateway' > /dev/null
          }
          check_ui "$REACT_UI_DOMAIN"
          check_ui "$UNO_UI_DOMAIN"
          echo "VPS rollback readiness and CRUD smoke passed."

  record-rollback:
    if: needs.validate-entry.outputs.operation == 'rollback'
    needs: [validate-entry, resolve-rollback, rollback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record rollback as current manifest
        env:
          SHA: ${{ needs.resolve-rollback.outputs.sha }}
          GATEWAY: ${{ needs.resolve-rollback.outputs.gateway }}
          API: ${{ needs.resolve-rollback.outputs.api }}
          SCHEDULER: ${{ needs.resolve-rollback.outputs.scheduler }}
          MIGRATOR: ${{ needs.resolve-rollback.outputs.migrator }}
          BLAZOR: ${{ needs.resolve-rollback.outputs.blazor }}
          REACT: ${{ needs.resolve-rollback.outputs.react }}
          UNO: ${{ needs.resolve-rollback.outputs.uno }}
          PREVIOUS_ID: ${{ needs.resolve-rollback.outputs.current-id }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" --arg gateway "$GATEWAY" --arg api "$API" --arg scheduler "$SCHEDULER" --arg migrator "$MIGRATOR" --arg blazor "$BLAZOR" --arg react "$REACT" --arg uno "$UNO" \
            --argjson previous "$PREVIOUS_ID" \
            '{schemaVersion:2,operation:"rollback",commitSha:$sha,images:{gateway:$gateway,api:$api,scheduler:$scheduler,migrator:$migrator,blazor:$blazor,react:$react,uno:$uno},previousManifestArtifactId:$previous}' > release-manifest.json
          pwsh -File ./infra/scripts/Test-ReleaseManifest.ps1 -Path release-manifest.json -ImagesOnly -ExpectedSchemaVersion 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskflow-release-manifest-vps
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
