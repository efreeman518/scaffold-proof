name: CI

on:
  # No push trigger: PR runs are the merge gate (both deploy workflows are workflow_dispatch only), so a
  # main-push run would only re-test the identical tree the PR run already verified.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        default: both
        options: [both, Azure, NonAzure]
        description: "Hosting lane(s) for manually dispatched acceptance"
      nonAzureReadModel:
        type: choice
        default: PostgreSqlJsonb
        options: [PostgreSqlJsonb, MongoDb]
        description: "NonAzure read model; MongoDb runs only when explicitly selected"
      includeE2E:
        type: boolean
        default: false
        description: "Run selected Azure/NonAzure Test.E2E lane(s) (requires Docker)"
      includeIntegration:
        type: boolean
        default: false
        description: "Run selected Azure/NonAzure Testcontainers lane(s) (requires Docker)"
      includeAspireMesh:
        type: boolean
        default: false
        description: "Run the capability-trimmed core Aspire mesh; use full acceptance for every host and UI"
      includeFoundryLocal:
        type: boolean
        default: false
        description: "Run Test.FoundryLocal live local model smoke tests (RID-bound; may download model assets)"
      includePlaywrightUI:
        type: boolean
        default: false
        description: "Run Test.PlaywrightUI browser smoke tests (requires browser install; starts Aspire AppHost)"
      includeFullAcceptance:
        type: boolean
        default: false
        description: "Run complete live Aspire host/UI and browser acceptance on the workstation runner"
      includeComposeSmoke:
        type: boolean
        default: false
        description: "Build images and smoke the NonAzure Compose stack through Caddy (requires Docker)"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out latest scaffold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: efreeman518/scaffold-ai
          ref: main
          path: .scaffold-source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate against latest scaffold
        run: |
          python -m pip install pyyaml jsonschema
          scaffold_commit=$(git -C .scaffold-source rev-parse HEAD)
          echo "Scaffold validation commit: $scaffold_commit"
          echo "Scaffold validation commit: \`$scaffold_commit\`" >> "$GITHUB_STEP_SUMMARY"
          python .scaffold-source/scripts/validate-reference.py --reference-root .

      # Seconds, no daemon work: catches a broken compose file or a variable removed from .env.example on
      # every run, instead of only when someone dispatches the compose smoke.
      - name: NonAzure lane compose config check
        run: |
          set -euo pipefail
          cd deploy/compose
          cat .env.example images.env.example > .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml config -q
          rm .env

      # Aspire/Integration tests pull several large container images (two SQL Server tags, azurite,
      # service bus emulator, redis). The hosted runner's ~14 GB free disk overflows mid-pull
      # ("no space left on device"), which surfaces as an AppHost resource-wait TimeoutException.
      # Reclaim ~20+ GB (Android SDK, Haskell, large apt packages) before the Docker-backed steps run.
      # Keep dotnet and the tool cache - the build depends on them.
      - name: Free disk space
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.includeAspireMesh || inputs.includeFoundryLocal || inputs.includePlaywrightUI) }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install required workloads
        run: dotnet workload install wasm-tools aspire

      - name: Require private NuGet feed credential
        env:
          NUGET_PAT: ${{ secrets.NUGET_PAT }}
        run: |
          if [ -z "$NUGET_PAT" ]; then
            echo "::error::NUGET_PAT secret is required to restore EF.* packages from GitHub Packages."
            exit 1
          fi

      - name: Restore
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        # Restore in the configuration the Release build below uses: Uno.Sdk conditions its implicit DevServer,
        # HotDesign and MCP package references on Optimize, so a Debug restore followed by a Release build with
        # --no-restore imports the DevServer targets and fails with UNOB0019.
        run: dotnet restore TaskFlow.slnx -p:Configuration=Release

      - name: Build
        # Static web assets writes shared obj caches and can race when the same web project is in
        # the solution and referenced by AppHost.
        run: dotnet build TaskFlow.slnx --no-restore --configuration Release -m:1

      - name: Analyzer cleanliness
        # Gate at warn: errors and warnings must be clean. Info-level advisories (e.g. CA1873
        # logging guards) stay visible in the IDE without blocking CI. Raise to --severity info
        # once those advisories are remediated at source.
        run: dotnet format analyzers TaskFlow.slnx --severity warn --verify-no-changes --no-restore

      - name: Unit Tests
        # The project boundary intentionally includes untagged provider, migration, deployment, and deprecated
        # alias contract tests. In runs 34718419269 and 34719228357 a relational-audit DI cycle left this testhost
        # silent for more than 13 minutes. The inner collector names the active test; the outer timeout stays red.
        timeout-minutes: 1
        run: |
          timeout --signal=INT --kill-after=5s 50s \
            dotnet test tests/Test.Unit/Test.Unit.csproj \
              --no-build --configuration Release \
              --blame-hang --blame-hang-timeout 15s \
              --logger "trx;LogFileName=unit-results.trx" \
              --results-directory ./TestResults

      - name: Architecture Tests
        run: >
          dotnet test tests/Test.Architecture/Test.Architecture.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=arch-results.trx"
          --results-directory ./TestResults

      - name: Endpoint Tests
        run: >
          dotnet test tests/Test.Endpoints/Test.Endpoints.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=endpoint-results.trx"
          --results-directory ./TestResults

      - name: FlowEngine Definition Tests
        run: >
          dotnet test tests/Test.Integration.FlowEngine/Test.Integration.FlowEngine.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=flowengine-results.trx"
          --results-directory ./TestResults

      # Deterministic graph construction only. This proves exact resource membership without claiming the
      # containers or hosts started; the manual workstation job below owns runnable full-lane proof.
      - name: Aspire lane topology contracts
        run: >
          dotnet test tests/Test.Aspire/Test.Aspire.csproj
          --no-build --configuration Release
          --filter "FullyQualifiedName~AppHostLaneTopologyTests|FullyQualifiedName~AppHostMigratorTopologyTests"
          --logger "trx;LogFileName=aspire-topology-results.trx"
          --results-directory ./TestResults

      - name: Aspire Core Lane Mesh Tests (manual)
        id: aspire_mesh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeAspireMesh == true }}
        timeout-minutes: 70
        env:
          TASKFLOW_RUN_AZURE_FOUNDRY_TESTS: "false"
          TASKFLOW_RUN_FUNCTIONS_TESTS: "false"
          TASKFLOW_REACT_TESTS_ENABLED: "false"
          TASKFLOW_WASM_TESTS_ENABLED: "false"
        # Captures container state WHILE the graph is up: the 2026-09-08/09 failures tore the graph down
        # before the diagnostics step ran, so `docker ps -a` was already empty and no container logs
        # survived. A background loop polls every 10 s until dotnet test exits, so a Login failed (18456)
        # or pre-login handshake error has evidence even after Aspire's own teardown.
        run: |
          mkdir -p /tmp/aspire-container-logs

          capture_loop() {
            while true; do
              {
                echo "=== $(date -u +%FT%TZ) docker ps -a ==="
                docker ps -a
                docker ps -a --format '{{.Names}}' 2>/dev/null | while IFS= read -r pname; do
                  [ -z "$pname" ] && continue
                  echo "--- docker port $pname ---"
                  docker port "$pname" || true
                done
              } >> /tmp/aspire-container-logs/ps.log 2>&1 || true

              docker ps -a --format '{{.Names}}' 2>/dev/null | while IFS= read -r name; do
                [ -z "$name" ] && continue
                lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
                case "$lower" in
                  *sql*)
                    docker logs --since 12s "$name" >> "/tmp/aspire-container-logs/${name}.log" 2>&1 || true
                    marker="/tmp/aspire-container-logs/.env-captured-${name}"
                    if [ ! -f "$marker" ]; then
                      docker inspect --format '{{.Name}} {{range .Config.Env}}{{println .}}{{end}}' "$name" 2>/dev/null \
                        | grep -iE 'MSSQL|SA_PASSWORD|ACCEPT' \
                        | sed -E 's/(PASSWORD=).*/\1<redacted>/' \
                        >> /tmp/aspire-container-logs/env.log 2>&1 || true
                      touch "$marker" || true
                    fi
                    ;;
                esac
              done || true

              sleep 10
            done
          }

          capture_loop &
          capture_pid=$!
          trap 'kill "$capture_pid" 2>/dev/null || true; wait "$capture_pid" 2>/dev/null || true' EXIT

          run_lane() {
            local lane="$1"
            local read_model="$2"
            echo "Running Aspire lane ${lane} with read model ${read_model}."
            TASKFLOW_LANE="$lane" TASKFLOW_READMODEL_PROVIDER="$read_model" \
              dotnet test tests/Test.Aspire/Test.Aspire.csproj \
                --no-build --configuration Release \
                -m:1 \
                --logger "trx;LogFileName=aspire-${lane}-${read_model}-results.trx" \
                --results-directory ./TestResults
          }

          test_exit=0
          if [ "${{ inputs.lane }}" = "both" ] || [ "${{ inputs.lane }}" = "Azure" ]; then
            run_lane Azure Cosmos || test_exit=$?
          fi
          if [ "$test_exit" -eq 0 ]; then
            if [ "${{ inputs.lane }}" = "both" ] || [ "${{ inputs.lane }}" = "NonAzure" ]; then
              run_lane NonAzure "${{ inputs.nonAzureReadModel }}" || test_exit=$?
            fi
          fi

          kill "$capture_pid" 2>/dev/null || true
          wait "$capture_pid" 2>/dev/null || true

          # Second safety net: print the captured evidence here too, in case a later gate (job cancellation,
          # a misconfigured if: on the diagnostics step) still skips it - the 2026-09-09 run had exactly that
          # (an if: with no status-check function gets an implicit success() ANDed in, so it never runs
          # after a failed step).
          if [ "$test_exit" -ne 0 ]; then
            echo "=== Aspire core lane mesh failed (exit $test_exit); captured container logs follow ==="
            if [ -d /tmp/aspire-container-logs ]; then
              for f in /tmp/aspire-container-logs/*; do
                [ -f "$f" ] || continue
                echo "--- tail -n 300 $f ---"
                tail -n 300 "$f" || true
              done
            else
              echo "no captured container logs directory"
            fi
          fi

          exit "$test_exit"

      # Best-effort: the 2026-09-08 failure (SqlException pre-login handshake, sql_check Unhealthy
      # throughout) had no runner-side evidence to explain it. if: must include failure() explicitly -
      # a condition with no status-check function gets an implicit success() ANDed in by GitHub Actions,
      # so steps.aspire_mesh.conclusion == 'failure' alone can never run once the Aspire step has failed
      # (found in run 34406418605, which skipped this step). continue-on-error so best-effort
      # diagnostics can never fail the job.
      - name: Aspire Mesh Diagnostics (on failure)
        if: ${{ failure() && steps.aspire_mesh.conclusion == 'failure' }}
        continue-on-error: true
        run: |
          free -m
          docker ps -a
          found=0
          while IFS= read -r name; do
            lower=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            case "$lower" in
              *sql*)
                found=1
                echo "=== docker logs --tail 200 $name ==="
                docker logs --tail 200 "$name" || true
                ;;
            esac
          done < <(docker ps -a --format '{{.Names}}')
          if [ "$found" -eq 0 ]; then
            echo "no sql containers"
          fi

          echo "=== captured container logs (docker may have already torn the graph down) ==="
          if [ -d /tmp/aspire-container-logs ]; then
            for f in /tmp/aspire-container-logs/*; do
              [ -f "$f" ] || continue
              echo "--- tail -300 $f ---"
              tail -n 300 "$f" || true
            done
          else
            echo "no captured container logs directory"
          fi

      - name: Foundry Local Tests (manual, live local)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeFoundryLocal == true && (inputs.lane == 'both' || inputs.lane == 'NonAzure') }}
        timeout-minutes: 70
        env:
          TASKFLOW_LANE: NonAzure
          TASKFLOW_READMODEL_PROVIDER: ${{ inputs.nonAzureReadModel }}
          TASKFLOW_AI_PROVIDER: FoundryLocal
        run: >
          dotnet test tests/Test.FoundryLocal/Test.FoundryLocal.csproj
          --no-build --configuration Release
          --filter TestCategory=FoundryLocal
          --logger "trx;LogFileName=foundrylocal-results.trx"
          --results-directory ./TestResults

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includePlaywrightUI == true }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/Test.PlaywrightUI/package-lock.json
            src/UI/TaskFlow.React/package-lock.json

      - name: Restore Playwright packages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includePlaywrightUI == true }}
        run: |
          npm ci --prefix tests/Test.PlaywrightUI
          npm ci --prefix src/UI/TaskFlow.React

      - name: Install Playwright browser
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includePlaywrightUI == true }}
        shell: pwsh
        run: |
          ./tests/Test.PlaywrightUI/bin/Release/net10.0/playwright.ps1 install chromium
          npx --prefix tests/Test.PlaywrightUI playwright install --with-deps chromium

      - name: Playwright UI Tests (manual, browser)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includePlaywrightUI == true }}
        timeout-minutes: 70
        run: |
          set -euo pipefail
          run_lane() {
            local lane="$1"
            local read_model="$2"
            echo "Running browser acceptance for ${lane} with read model ${read_model}."
            TASKFLOW_LANE="$lane" TASKFLOW_READMODEL_PROVIDER="$read_model" \
              dotnet test tests/Test.PlaywrightUI/Test.PlaywrightUI.csproj \
                --no-build --configuration Release \
                -m:1 \
                --logger "trx;LogFileName=playwrightui-${lane}-${read_model}-results.trx" \
                --results-directory ./TestResults
          }

          if [ "${{ inputs.lane }}" = "both" ] || [ "${{ inputs.lane }}" = "Azure" ]; then
            run_lane Azure Cosmos
          fi
          if [ "${{ inputs.lane }}" = "both" ] || [ "${{ inputs.lane }}" = "NonAzure" ]; then
            run_lane NonAzure "${{ inputs.nonAzureReadModel }}"
          fi

      - name: Migration model drift gate
        run: >
          dotnet test tests/Test.Unit/Test.Unit.csproj
          --no-build --configuration Release
          --filter FullyQualifiedName~MigrationModelContractTests
          --logger "trx;LogFileName=migration-model-results.trx"
          --results-directory ./TestResults

      - name: Deployment workflow contract gate
        run: >
          dotnet test tests/Test.Unit/Test.Unit.csproj
          --no-build --configuration Release
          --filter FullyQualifiedName~DeploymentWorkflowContractTests
          --logger "trx;LogFileName=deployment-contract-results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/*.xml
            ./TestResults/**/*.dmp
          if-no-files-found: warn

  # Complete runnable graph proof is manual and uses the zero-billable-minute workstation runner. Unlike
  # the deterministic topology contracts, this starts every lane host and UI, then drives all three UIs.
  full-lane-acceptance:
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeFullAcceptance == true }}
    runs-on: [self-hosted, workstation]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      TASKFLOW_ASPIRE_FULL_LANE: "true"
      TASKFLOW_RUN_ASPIRE_TESTS: "true"
      TASKFLOW_RUN_AZURE_FOUNDRY_TESTS: "false"
      TASKFLOW_RUN_FOUNDRY_LOCAL_TESTS: "false"
      TASKFLOW_ASPIRE_SCHEDULER_AVAILABLE: "true"
      TASKFLOW_REACT_TESTS_ENABLED: "true"
      TASKFLOW_WASM_TESTS_ENABLED: "true"
      TASKFLOW_PLAYWRIGHT_TESTS_ENABLED: "true"
      TASKFLOW_MOBILE_TESTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/Test.PlaywrightUI/package-lock.json
            src/UI/TaskFlow.React/package-lock.json

      - name: Verify workstation runtime prerequisites
        run: |
          docker info | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Docker runtime is required for complete lane acceptance."
          }

          $installedWorkloads = @(dotnet workload list)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect installed .NET workloads."
          }
          $missingWorkloads = @(
            @("wasm-tools", "aspire") | Where-Object {
              -not ($installedWorkloads | Select-String -Pattern "^\s*$([regex]::Escape($_))\s" -Quiet)
            }
          )
          if ($missingWorkloads.Count -gt 0) {
            throw "Missing required .NET workload(s): $($missingWorkloads -join ', '). Run: dotnet workload install wasm-tools aspire"
          }

          $azureSelected = "${{ inputs.lane }}" -in @("both", "Azure")
          if ($azureSelected -and -not (Get-Command func -ErrorAction SilentlyContinue)) {
            throw "Azure Functions Core Tools ('func') is required for complete Azure lane acceptance."
          }

      - name: Require private NuGet feed credential
        env:
          NUGET_PAT: ${{ secrets.NUGET_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_PAT)) {
            throw "NUGET_PAT secret is required to restore EF.* packages."
          }

      - name: Restore and build complete host/UI graph
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        run: |
          dotnet restore TaskFlow.slnx -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw "Solution restore failed." }
          dotnet build TaskFlow.slnx --no-restore --configuration Release -m:1
          if ($LASTEXITCODE -ne 0) { throw "Solution build failed." }
          dotnet build src/UI/TaskFlow.Uno/TaskFlow.Uno.csproj --no-restore --configuration Release -m:1
          if ($LASTEXITCODE -ne 0) { throw "Uno browser build failed." }
          npm ci --prefix src/UI/TaskFlow.React
          if ($LASTEXITCODE -ne 0) { throw "React package restore failed." }
          npm ci --prefix tests/Test.PlaywrightUI
          if ($LASTEXITCODE -ne 0) { throw "Playwright package restore failed." }

      - name: Install Playwright Chromium
        run: |
          ./tests/Test.PlaywrightUI/bin/Release/net10.0/playwright.ps1 install chromium
          if ($LASTEXITCODE -ne 0) { throw "Playwright Chromium installation failed." }

      - name: Start and verify complete selected lane graphs
        timeout-minutes: 105
        run: |
          function Invoke-LaneAcceptance([string] $Lane, [string] $ReadModel, [bool] $RunFunctions) {
            Write-Host "Running complete ${Lane} lane acceptance with ${ReadModel} read model."
            $env:TASKFLOW_LANE = $Lane
            $env:TASKFLOW_READMODEL_PROVIDER = $ReadModel
            $env:TASKFLOW_RUN_FUNCTIONS_TESTS = $RunFunctions.ToString().ToLowerInvariant()

            if ($Lane -eq "Azure") {
              $env:TASKFLOW_DB_PROVIDER = "SqlServer"
              $env:TASKFLOW_MESSAGING_PROVIDER = "ServiceBus"
              $env:TASKFLOW_STORAGE_PROVIDER = "AzureBlob"
              $env:TASKFLOW_AUDIT_PROVIDER = "AzureTable"
              $env:TASKFLOW_DATAPROTECTION_PERSISTENCE = "AzureBlob"
              $aspireFilter = "FullyQualifiedName~AppSurfaceAspireTests|FullyQualifiedName~ApiAuditPipelineTests|FullyQualifiedName~FunctionAuditPipelineTests|FullyQualifiedName~OutboxMeshTests"
            }
            else {
              $env:TASKFLOW_DB_PROVIDER = "PostgreSql"
              $env:TASKFLOW_MESSAGING_PROVIDER = "RabbitMq"
              $env:TASKFLOW_STORAGE_PROVIDER = "S3"
              $env:TASKFLOW_AUDIT_PROVIDER = "Relational"
              $env:TASKFLOW_DATAPROTECTION_PERSISTENCE = "Redis"
              $aspireFilter = "FullyQualifiedName~AppSurfaceAspireTests|FullyQualifiedName~OutboxMeshTests"
            }

            dotnet test tests/Test.Aspire/Test.Aspire.csproj `
              --no-build --configuration Release -m:1 `
              --filter $aspireFilter `
              --logger "trx;LogFileName=full-aspire-${Lane}-${ReadModel}-results.trx" `
              --results-directory ./TestResults
            if ($LASTEXITCODE -ne 0) { throw "${Lane} complete Aspire graph acceptance failed." }

            dotnet test tests/Test.PlaywrightUI/Test.PlaywrightUI.csproj `
              --no-build --configuration Release -m:1 `
              --filter "TestCategory=PlaywrightUI|TestCategory=WasmUI" `
              --logger "trx;LogFileName=full-ui-${Lane}-${ReadModel}-results.trx" `
              --results-directory ./TestResults
            if ($LASTEXITCODE -ne 0) { throw "${Lane} browser acceptance failed." }
          }

          if ("${{ inputs.lane }}" -in @("both", "Azure")) {
            Invoke-LaneAcceptance -Lane Azure -ReadModel Cosmos -RunFunctions $true
          }
          if ("${{ inputs.lane }}" -in @("both", "NonAzure")) {
            Invoke-LaneAcceptance -Lane NonAzure -ReadModel "${{ inputs.nonAzureReadModel }}" -RunFunctions $false
          }

      - name: Upload full-lane test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-lane-test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

  # Manual Docker-backed acceptance runs through the same canonical lane contract as Aspire and production.
  # The full Test.Unit project above retains coverage for TASKFLOW_TEST_DB_PROVIDER as a deprecated input alias.
  database-lanes:
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.includeE2E == true || inputs.includeIntegration == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [Azure, NonAzure]
    env:
      TASKFLOW_LANE: ${{ matrix.lane }}
      TASKFLOW_READMODEL_PROVIDER: ${{ matrix.lane == 'Azure' && 'Cosmos' || inputs.nonAzureReadModel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}

      - name: Free disk space
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}
        with:
          global-json-file: global.json

      - name: Install required workloads
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}
        run: dotnet workload install wasm-tools aspire

      - name: Restore
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        run: dotnet restore TaskFlow.slnx -p:Configuration=Release

      - name: Build test lanes
        if: ${{ inputs.lane == 'both' || inputs.lane == matrix.lane }}
        run: |
          dotnet build tests/Test.E2E/Test.E2E.csproj --no-restore --configuration Release -m:1
          dotnet build tests/Test.Integration/Test.Integration.csproj --no-restore --configuration Release -m:1

      - name: E2E Tests (${{ matrix.lane }})
        if: ${{ inputs.includeE2E == true && (inputs.lane == 'both' || inputs.lane == matrix.lane) }}
        timeout-minutes: 20
        run: >
          dotnet test tests/Test.E2E/Test.E2E.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=e2e-${{ matrix.lane }}-results.trx"
          --results-directory ./TestResults

      - name: Integration Tests (${{ matrix.lane }}, component)
        if: ${{ inputs.includeIntegration == true && (inputs.lane == 'both' || inputs.lane == matrix.lane) }}
        timeout-minutes: 20
        run: >
          dotnet test tests/Test.Integration/Test.Integration.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-${{ matrix.lane }}-results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: ${{ always() && (inputs.lane == 'both' || inputs.lane == matrix.lane) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.lane }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

  # NonAzure lane end-to-end proof (D-060). Dispatch-gated: it builds the app images from source, so
  # it is the most expensive job in this file and nothing about it belongs on a push.
  compose-smoke:
    needs: build-and-test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeComposeSmoke == true && (inputs.lane == 'both' || inputs.lane == 'NonAzure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROFILES: ${{ inputs.nonAzureReadModel == 'MongoDb' && 'local,mongo' || 'local' }}
    defaults:
      run:
        working-directory: deploy/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Require private NuGet feed credential
        env:
          NUGET_PAT: ${{ secrets.NUGET_PAT }}
        run: |
          [[ -n "$NUGET_PAT" ]] || { echo "::error::NUGET_PAT secret is required to build the app images."; exit 1; }

      # CI-only environment. Every credential here matches the dev-only values hard-coded in the local
      # topology. Passwords are generated per run, masked before use, and never printed.
      - name: Write the CI environment
        run: |
          set -euo pipefail
          redis_password=$(openssl rand -hex 24)
          mongo_password=$(openssl rand -hex 24)
          echo "::add-mask::$redis_password"
          echo "::add-mask::$mongo_password"
          cat > .env <<ENV
          TASKFLOW_LANE=NonAzure
          TASKFLOW_READMODEL_PROVIDER=${{ inputs.nonAzureReadModel }}
          ReadModel__Provider=${{ inputs.nonAzureReadModel }}
          TASKFLOW_AI_PROVIDER=None
          Database__PostgreSql__PoolerMode=None
          ConnectionStrings__TaskFlowDbContextTrxn=Host=postgres;Port=5432;Database=taskflowdb;Username=taskflow;Password=taskflow-dev-password
          ConnectionStrings__TaskFlowDbContextQuery=Host=postgres;Port=5432;Database=taskflowdb;Username=taskflow;Password=taskflow-dev-password
          ConnectionStrings__TaskFlowFlowEngineDbContext=Host=postgres;Port=5432;Database=taskflowdb;Username=taskflow;Password=taskflow-dev-password
          ConnectionStrings__TickerQDbContext=Host=postgres;Port=5432;Database=taskflowdb;Username=taskflow;Password=taskflow-dev-password
          REDIS_PASSWORD=$redis_password
          ConnectionStrings__Redis1=redis:6379,password=$redis_password,abortConnect=false
          ConnectionStrings__RabbitMq1=amqp://taskflow:taskflow-dev-password@rabbitmq:5672
          Messaging__RabbitMq__ConnectionString=amqp://taskflow:taskflow-dev-password@rabbitmq:5672
          MONGO_INITDB_ROOT_USERNAME=taskflow-ci
          MONGO_INITDB_ROOT_PASSWORD=$mongo_password
          ConnectionStrings__MongoDb1=mongodb://taskflow-ci:$mongo_password@mongo:27017/taskflow?authSource=admin
          Storage__S3__ServiceUrl=http://seaweedfs:8333
          Storage__S3__PublicServiceUrl=http://s3.localhost
          Storage__S3__Region=us-east-1
          Storage__S3__AccessKeyId=taskflowseaweedfs
          Storage__S3__SecretAccessKey=taskflowseaweedfs-dev-secret
          Storage__S3__ForcePathStyle=true
          Database__Encryption__LocalKeyBase64=$(openssl rand -base64 32)
          Database__Encryption__BlindIndexKeyBase64=$(openssl rand -base64 32)
          Gateway__BaseUrl=http://gateway:8080
          GATEWAY_BASE_URL=http://localhost
          Grpc__TaskFlowRead__Address=http://api:8081
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4317
          CADDY_DOMAIN=localhost
          BLAZOR_UI_ORIGIN=http://localhost
          REACT_UI_ORIGIN=http://react.localhost
          UNO_UI_ORIGIN=http://uno.localhost
          REACT_UI_DOMAIN=react.localhost
          UNO_UI_DOMAIN=uno.localhost
          S3_PUBLIC_DOMAIN=s3.localhost
          ACME_EMAIL=ci@example.invalid
          ENV
          cat images.env.example >> .env
          chmod 600 .env

      - name: Build the seven app images
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local build

      - name: Start the local-profile stack
        run: |
          set -euo pipefail
          # Deliberately not --wait here: the migrator is a one-shot service and `up --wait` semantics for a
          # container that exits 0 have moved between Compose versions. The readiness poll below is the
          # actual gate, and it is the same URL Caddy health-checks its upstreams with.
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local up -d
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local ps

      - name: Wait for readiness through Caddy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost/healthz/ready > /dev/null 2>&1; then
              echo "Ready after ${attempt} attempt(s)."; exit 0
            fi
            sleep 5
          done
          echo "::error::/healthz/ready never answered through Caddy"; exit 1

      - name: One CRUD round trip through the gateway
        run: |
          set -euo pipefail
          # Scaffold auth succeeds every request with a fixed identity (D-002), so no header is needed -
          # the same convention infra/scripts/Invoke-DeploymentSmoke.ps1 relies on.
          created=$(curl -fsS -X POST http://localhost/api/v1/task-items -H 'Content-Type: application/json'             -d '{"item":{"title":"compose-smoke","priority":"Medium"}}')
          id=$(jq -er '.item.id' <<< "$created")
          curl -fsS "http://localhost/api/v1/task-items/${id}" | jq -er --arg id "$id" 'select(.item.id == $id)' > /dev/null
          curl -fsS -X DELETE "http://localhost/api/v1/task-items/${id}" > /dev/null
          echo "Compose lane create/read/delete round trip passed."

      - name: Verify static UI roots and runtime gateway configuration
        run: |
          set -euo pipefail
          check_ui() {
            local host="$1"
            for attempt in $(seq 1 60); do
              if curl -fsS --resolve "${host}:80:127.0.0.1" "http://${host}/" > /dev/null 2>&1 \
                && curl -fsS --resolve "${host}:80:127.0.0.1" "http://${host}/app-config.json" \
                  | jq -e --arg gateway 'http://localhost' '.gatewayBaseUrl == $gateway' > /dev/null; then
                echo "${host} passed after ${attempt} attempt(s)."
                return 0
              fi
              sleep 5
            done
            echo "::error::${host} did not serve the expected runtime configuration"; return 1
          }
          check_ui react.localhost
          check_ui uno.localhost

      - name: Dump stack logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local logs --no-color --tail 400

      - name: Tear the stack down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local down -v --remove-orphans
          rm -f .env

