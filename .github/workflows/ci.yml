name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly deep-lane run (Mon 06:17 UTC): keeps the Docker-backed E2E/Integration/
  # Aspire lanes continuously green instead of only when manually dispatched.
  # FoundryLocal (model download) and PlaywrightUI (browser + full stack) stay
  # dispatch-only for cost/flakiness reasons.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      includeE2E:
        type: boolean
        default: false
        description: "Run Test.E2E SQL-backed HTTP workflow tests (requires Docker)"
      includeIntegration:
        type: boolean
        default: false
        description: "Run Test.Integration component tests (standalone Testcontainers database + Azurite; requires Docker)"
      dbProvider:
        type: choice
        default: both
        options: [both, SqlServer, PostgreSql]
        description: "Database provider lane(s) for the Docker-backed E2E and Integration jobs (TASKFLOW_TEST_DB_PROVIDER)"
      includeAspireMesh:
        type: boolean
        default: false
        description: "Run Test.Aspire distributed-app mesh tests (full AppHost graph; requires Docker)"
      includeFoundryLocal:
        type: boolean
        default: false
        description: "Run Test.FoundryLocal live local model smoke tests (RID-bound; may download model assets)"
      includePlaywrightUI:
        type: boolean
        default: false
        description: "Run Test.PlaywrightUI browser smoke tests (requires browser install; starts Aspire AppHost)"
      includeFullAcceptance:
        type: boolean
        default: false
        description: "Run unfiltered serial solution acceptance, including Aspire, Playwright, and WASM"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out latest scaffold
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: efreeman518/scaffold-ai
          ref: main
          path: .scaffold-source
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate against latest scaffold
        run: |
          python -m pip install pyyaml jsonschema
          scaffold_commit=$(git -C .scaffold-source rev-parse HEAD)
          echo "Scaffold validation commit: $scaffold_commit"
          echo "Scaffold validation commit: \`$scaffold_commit\`" >> "$GITHUB_STEP_SUMMARY"
          python .scaffold-source/scripts/validate-reference.py --reference-root .

      # Aspire/Integration tests pull several large container images (two SQL Server tags, azurite,
      # service bus emulator, redis). The hosted runner's ~14 GB free disk overflows mid-pull
      # ("no space left on device"), which surfaces as an AppHost resource-wait TimeoutException.
      # Reclaim ~20+ GB (Android SDK, Haskell, large apt packages) before the Docker-backed steps run.
      # Keep dotnet and the tool cache - the build depends on them.
      - name: Free disk space
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.includeAspireMesh || inputs.includeFoundryLocal || inputs.includePlaywrightUI || inputs.includeFullAcceptance)) || github.event_name == 'schedule' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install required workloads
        run: dotnet workload install wasm-tools aspire

      - name: Require private NuGet feed credential
        env:
          NUGET_PAT: ${{ secrets.NUGET_PAT }}
        run: |
          if [ -z "$NUGET_PAT" ]; then
            echo "::error::NUGET_PAT secret is required to restore EF.* packages from GitHub Packages."
            exit 1
          fi

      - name: Restore
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        run: dotnet restore TaskFlow.slnx

      - name: Build
        # Static web assets writes shared obj caches and can race when the same web project is in
        # the solution and referenced by AppHost.
        run: dotnet build TaskFlow.slnx --no-restore --configuration Release -m:1

      - name: Analyzer cleanliness
        # Gate at warn: errors and warnings must be clean. Info-level advisories (e.g. CA1873
        # logging guards) stay visible in the IDE without blocking CI. Raise to --severity info
        # once those advisories are remediated at source.
        run: dotnet format analyzers TaskFlow.slnx --severity warn --verify-no-changes --no-restore

      - name: Unit Tests
        run: >
          dotnet test tests/Test.Unit/Test.Unit.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          --results-directory ./TestResults

      - name: Architecture Tests
        run: >
          dotnet test tests/Test.Architecture/Test.Architecture.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=arch-results.trx"
          --results-directory ./TestResults

      - name: Endpoint Tests
        run: >
          dotnet test tests/Test.Endpoints/Test.Endpoints.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=endpoint-results.trx"
          --results-directory ./TestResults

      - name: FlowEngine Definition Tests
        run: >
          dotnet test tests/Test.Integration.FlowEngine/Test.Integration.FlowEngine.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=flowengine-results.trx"
          --results-directory ./TestResults

      - name: Aspire Mesh Tests (manual or scheduled, full graph)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.includeAspireMesh == true) || github.event_name == 'schedule' }}
        timeout-minutes: 30
        env:
          TASKFLOW_RUN_AZURE_FOUNDRY_TESTS: "false"
          TASKFLOW_RUN_FUNCTIONS_TESTS: "false"
          TASKFLOW_REACT_TESTS_ENABLED: "false"
          TASKFLOW_WASM_TESTS_ENABLED: "false"
        run: >
          dotnet test tests/Test.Aspire/Test.Aspire.csproj
          --no-build --configuration Release
          -m:1
          --logger "trx;LogFileName=aspire-results.trx"
          --results-directory ./TestResults

      - name: Foundry Local Tests (manual, live local)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeFoundryLocal == true }}
        timeout-minutes: 70
        run: >
          dotnet test tests/Test.FoundryLocal/Test.FoundryLocal.csproj
          --no-build --configuration Release
          --filter TestCategory=FoundryLocal
          --logger "trx;LogFileName=foundrylocal-results.trx"
          --results-directory ./TestResults

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.includePlaywrightUI == true || inputs.includeFullAcceptance == true) }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/Test.PlaywrightUI/package-lock.json
            src/UI/TaskFlow.React/package-lock.json

      - name: Restore Playwright packages
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.includePlaywrightUI == true || inputs.includeFullAcceptance == true) }}
        run: |
          npm ci --prefix tests/Test.PlaywrightUI
          npm ci --prefix src/UI/TaskFlow.React

      - name: Install Playwright browser
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.includePlaywrightUI == true || inputs.includeFullAcceptance == true) }}
        shell: pwsh
        run: |
          ./tests/Test.PlaywrightUI/bin/Release/net10.0/playwright.ps1 install chromium
          npx --prefix tests/Test.PlaywrightUI playwright install --with-deps chromium

      - name: Playwright UI Tests (manual, browser)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includePlaywrightUI == true }}
        timeout-minutes: 70
        run: >
          dotnet test tests/Test.PlaywrightUI/Test.PlaywrightUI.csproj
          --no-build --configuration Release
          -m:1
          --logger "trx;LogFileName=playwrightui-results.trx"
          --results-directory ./TestResults

      - name: Migration model drift gate
        run: >
          dotnet test tests/Test.Unit/Test.Unit.csproj
          --no-build --configuration Release
          --filter FullyQualifiedName~MigrationModelContractTests
          --logger "trx;LogFileName=migration-model-results.trx"
          --results-directory ./TestResults

      - name: Deployment workflow contract gate
        run: >
          dotnet test tests/Test.Unit/Test.Unit.csproj
          --no-build --configuration Release
          --filter FullyQualifiedName~DeploymentWorkflowContractTests
          --logger "trx;LogFileName=deployment-contract-results.trx"
          --results-directory ./TestResults

      - name: Full serial solution acceptance (manual, unfiltered)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.includeFullAcceptance == true }}
        timeout-minutes: 90
        env:
          TASKFLOW_MOBILE_TESTS_ENABLED: "false"
          TASKFLOW_RUN_AZURE_FOUNDRY_TESTS: "false"
          TASKFLOW_RUN_FOUNDRY_LOCAL_TESTS: "false"
          TASKFLOW_RUN_FUNCTIONS_TESTS: "false"
        run: >
          dotnet test TaskFlow.slnx
          --no-build --configuration Release
          -m:1
          --logger "trx;LogFileName=full-acceptance-results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ./TestResults/*.trx

  # Docker-backed lanes run once per database provider (D-020). Same assemblies, TASKFLOW_TEST_DB_PROVIDER
  # selects the Testcontainer and the host's Database:Provider; the matrix is filtered by the dbProvider input.
  database-lanes:
    needs: build-and-test
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.includeE2E == true || inputs.includeIntegration == true)) || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dbProvider: [SqlServer, PostgreSql]
    env:
      TASKFLOW_TEST_DB_PROVIDER: ${{ matrix.dbProvider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}

      - name: Free disk space
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          dotnet: false
          android: true
          haskell: true
          large-packages: true
          swap-storage: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}
        with:
          global-json-file: global.json

      - name: Install required workloads
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}
        run: dotnet workload install wasm-tools aspire

      - name: Restore
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}
        env:
          NuGetPackageSourceCredentials_efreeman518-github: Username=github-actions;Password=${{ secrets.NUGET_PAT }};ValidAuthenticationTypes=Basic
        run: dotnet restore TaskFlow.slnx

      - name: Build test lanes
        if: ${{ github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider }}
        run: |
          dotnet build tests/Test.E2E/Test.E2E.csproj --no-restore --configuration Release -m:1
          dotnet build tests/Test.Integration/Test.Integration.csproj --no-restore --configuration Release -m:1

      - name: E2E Tests (${{ matrix.dbProvider }})
        if: ${{ (github.event_name == 'schedule' || inputs.includeE2E == true) && (github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider) }}
        timeout-minutes: 20
        run: >
          dotnet test tests/Test.E2E/Test.E2E.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=e2e-${{ matrix.dbProvider }}-results.trx"
          --results-directory ./TestResults

      - name: Integration Tests (${{ matrix.dbProvider }}, component)
        if: ${{ (github.event_name == 'schedule' || inputs.includeIntegration == true) && (github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider) }}
        timeout-minutes: 20
        run: >
          dotnet test tests/Test.Integration/Test.Integration.csproj
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-${{ matrix.dbProvider }}-results.trx"
          --results-directory ./TestResults

      - name: Upload Test Results
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dbProvider == 'both' || inputs.dbProvider == matrix.dbProvider) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.dbProvider }}
          path: ./TestResults/*.trx

  # TODO: Enable auto-deploy after running bootstrap.ps1 and configuring GitHub secrets/variables.
  # Remove workflow_dispatch from deploy.yml once this is enabled - manual trigger won't be needed.
