<svg width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" style="max-width: 1300px; background-color: transparent;" role="graphics-document document" aria-roledescription="Outbox to messaging flow">
<defs>
<marker id="d9-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L8,3 L0,6 Z" fill="lightgrey"/>
</marker>
</defs>
<style>
.d9-box{fill:#1f2020;stroke:#ccc;stroke-width:1;}
.d9-dlq{fill:#2a1f1f;stroke:#a44141;stroke-width:1;}
.d9-text{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:14px;text-anchor:middle;}
.d9-text-sm{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;text-anchor:middle;}
.d9-edge{stroke:lightgrey;stroke-width:1.5;fill:none;marker-end:url(#d9-arrow);}
.d9-edge-dash{stroke:#a44141;stroke-width:1.5;stroke-dasharray:5,4;fill:none;marker-end:url(#d9-arrow);}
.d9-title{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:13px;font-weight:bold;text-anchor:middle;}
</style>

<text x="650" y="20" class="d9-title">6.2 Domain Event -&gt; Transactional Outbox -&gt; Messaging -&gt; Consumers</text>

<!-- Row: aggregate + scheduler staging -->
<rect class="d9-box" x="390" y="35" width="320" height="50" rx="6"/>
<text x="550" y="55" class="d9-text">TaskItem raises domain event</text>
<text x="550" y="72" class="d9-text-sm">Create / TransitionStatus (IHasDomainEvents)</text>

<rect class="d9-box" x="40" y="115" width="320" height="50" rx="6"/>
<text x="200" y="135" class="d9-text">Scheduler jobs stage directly</text>
<text x="200" y="152" class="d9-text-sm">overdue/recurrence/stale: IOutboxStaging.Stage(envelope, id)</text>

<rect class="d9-box" x="390" y="115" width="320" height="50" rx="6"/>
<text x="550" y="135" class="d9-text">OutboxStagingInterceptor</text>
<text x="550" y="152" class="d9-text-sm">SavingChangesAsync - same transaction as the save</text>

<rect class="d9-box" x="370" y="195" width="360" height="50" rx="6"/>
<text x="550" y="215" class="d9-text">OutboxMessage row (schema taskflow)</text>
<text x="550" y="232" class="d9-text-sm">SQL Server or PostgreSQL - one provider-neutral table</text>

<rect class="d9-box" x="390" y="275" width="320" height="60" rx="6"/>
<text x="550" y="296" class="d9-text">Scheduler: OutboxDispatcherService</text>
<text x="550" y="312" class="d9-text-sm">lease claim (ExecuteUpdate), send batch</text>
<text x="550" y="327" class="d9-text-sm">poll 1s, idle backoff to 5s</text>

<rect class="d9-dlq" x="760" y="275" width="360" height="60" rx="6"/>
<text x="940" y="296" class="d9-text">Outbox dead-letter</text>
<text x="940" y="312" class="d9-text-sm">AttemptCount &gt;= 10 -&gt; DeadLetteredAtUtc (row kept)</text>
<text x="940" y="327" class="d9-text-sm">admin retry: POST /api/v1/admin/outbox/{id}/retry</text>

<rect class="d9-box" x="310" y="365" width="320" height="55" rx="6"/>
<text x="470" y="386" class="d9-text">Messaging:Provider switch</text>
<text x="470" y="403" class="d9-text-sm">Service Bus topic DomainEvents (dup detection) OR RabbitMQ exchange taskflow.domain-events</text>

<rect class="d9-dlq" x="680" y="365" width="360" height="55" rx="6"/>
<text x="860" y="386" class="d9-text">Broker dead-letter</text>
<text x="860" y="403" class="d9-text-sm">malformed envelope or MaxDeliveryCount exceeded -&gt; taskflow.dead-letter / DLQ, reason header set</text>

<!-- Three consumer lanes -->
<rect class="d9-box" x="40" y="455" width="260" height="45" rx="6"/>
<text x="170" y="480" class="d9-text">projection subscription/queue</text>

<rect class="d9-box" x="520" y="455" width="260" height="45" rx="6"/>
<text x="650" y="480" class="d9-text">ai-review subscription/queue</text>

<rect class="d9-box" x="980" y="455" width="260" height="45" rx="6"/>
<text x="1110" y="480" class="d9-text">workflow subscription/queue</text>

<rect class="d9-box" x="40" y="525" width="260" height="40" rx="6"/>
<text x="170" y="550" class="d9-text-sm">ConsumerInbox.TryClaimAsync(consumer, MessageId)</text>

<rect class="d9-box" x="520" y="525" width="260" height="40" rx="6"/>
<text x="650" y="550" class="d9-text-sm">inbox claim + comment, one SaveChanges</text>

<rect class="d9-box" x="980" y="525" width="260" height="40" rx="6"/>
<text x="1110" y="550" class="d9-text-sm">inbox claim + StartRequest.IdempotencyKey</text>

<rect class="d9-box" x="40" y="590" width="260" height="50" rx="6"/>
<text x="170" y="611" class="d9-text-sm">Cosmos: delta patch or full</text>
<text x="170" y="627" class="d9-text-sm">re-projection (TaskViewDocument)</text>

<rect class="d9-box" x="520" y="590" width="260" height="50" rx="6"/>
<text x="650" y="611" class="d9-text-sm">AiTaskReviewer adds</text>
<text x="650" y="627" class="d9-text-sm">a task comment</text>

<rect class="d9-box" x="980" y="590" width="260" height="50" rx="6"/>
<text x="1110" y="611" class="d9-text-sm">ai-task-triage FlowEngine</text>
<text x="1110" y="627" class="d9-text-sm">workflow instance starts</text>

<!-- Edges -->
<path class="d9-edge" d="M550,85 L550,115"/>
<path class="d9-edge" d="M360,140 L390,140"/>
<path class="d9-edge" d="M550,165 L550,195"/>
<path class="d9-edge" d="M550,245 L550,275"/>
<path class="d9-edge-dash" d="M710,300 L760,300"/>
<path class="d9-edge" d="M550,335 L470,365"/>
<path class="d9-edge-dash" d="M630,392 L680,392"/>
<path class="d9-edge" d="M400,420 L170,455"/>
<path class="d9-edge" d="M470,420 L650,455"/>
<path class="d9-edge" d="M560,420 L1110,455"/>
<path class="d9-edge" d="M170,500 L170,525"/>
<path class="d9-edge" d="M650,500 L650,525"/>
<path class="d9-edge" d="M1110,500 L1110,525"/>
<path class="d9-edge" d="M170,565 L170,590"/>
<path class="d9-edge" d="M650,565 L650,590"/>
<path class="d9-edge" d="M1110,565 L1110,590"/>
</svg>
