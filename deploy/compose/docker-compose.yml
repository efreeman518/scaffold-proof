# TaskFlow NonAzure lane - production stack for a single VPS (D-060, D-036).
#
# This file is the canonical NonAzure stack: PostgreSQL, RabbitMQ and SeaweedFS run beside the TaskFlow
# hosts. docker-compose.override.local.yml adds local image builds only, so CI validates the same topology.
#
# Images are digest-pinned by the deploy job, which writes deploy/compose/images.env on the VPS. Compose
# interpolates only from .env, so the deploy job appends images.env into .env - see README.md.
#
# App containers are chiseled (no shell, no curl), so they carry no compose healthcheck on purpose. Caddy's
# active upstream health checks against /healthz/ready are what gate traffic, and the migrator's
# service_completed_successfully is what gates startup. See README.md "Why the app services have no healthcheck".

name: taskflow

x-nonazure-providers: &nonazure-providers
  Hosting__Lane: NonAzure
  Database__Provider: PostgreSql
  Messaging__Provider: RabbitMq
  Storage__Provider: S3
  ReadModel__Provider: ${ReadModel__Provider:-PostgreSqlJsonb}
  Audit__Provider: Relational
  Search__Provider: Sql
  AiServices__Provider: None
  DataProtection__Persistence: Redis

x-app-common: &app-common
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *nonazure-providers
    ASPNETCORE_ENVIRONMENT: Production
    DOTNET_gcServer: "1"
  depends_on:
    # MongoDB is an explicit profile. When selected, API/Scheduler must not race index provisioning; when
    # absent, default PostgreSQL JSONB startup remains valid.
    mongo:
      condition: service_healthy
      required: false
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
  networks:
    - taskflow

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The only published ports in the stack. Everything else talks over the internal network.
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      REACT_UI_DOMAIN: ${REACT_UI_DOMAIN}
      UNO_UI_DOMAIN: ${UNO_UI_DOMAIN}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - taskflow

  # Single migration owner (same rule as the AppHost): runs to completion, every app service waits for it.
  migrator:
    image: ${TASKFLOW_MIGRATOR_IMAGE}
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - taskflow

  api:
    <<: *app-common
    image: ${TASKFLOW_API_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      Cors__AllowedOrigins__0: ${BLAZOR_UI_ORIGIN}
      Cors__AllowedOrigins__1: ${REACT_UI_ORIGIN}
      Cors__AllowedOrigins__2: ${UNO_UI_ORIGIN}
      # 8080 REST, 8081 cleartext HTTP/2 for the internal gRPC read service (D-054). Both come from the
      # image's own Kestrel:Endpoints section; nothing here overrides them.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  gateway:
    <<: *app-common
    image: ${TASKFLOW_GATEWAY_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      ReverseProxy__Clusters__api-cluster__Destinations__api__Address: http://api:8080
      AggregateHealthCheck__TaskFlowApiHealthUrl: http://api:8080/health/full
      # Caddy terminates TLS, so the gateway must trust one hop of forwarded headers to see the real scheme.
      Proxy__ForwardedHeaders__Enabled: "true"
      Proxy__ForwardedHeaders__ForwardLimit: "1"
      CorsSettings__AllowedOrigins__0: ${BLAZOR_UI_ORIGIN}
      CorsSettings__AllowedOrigins__1: ${REACT_UI_ORIGIN}
      CorsSettings__AllowedOrigins__2: ${UNO_UI_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  scheduler:
    <<: *app-common
    image: ${TASKFLOW_SCHEDULER_IMAGE}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  blazor:
    <<: *app-common
    image: ${TASKFLOW_BLAZOR_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      # Gateway__BaseUrl comes from .env: it is the public origin a browser talks to (https://<domain>
      # on the VPS, http://gateway:8080 in the CI smoke), so it is not derivable from CADDY_DOMAIN alone.
      # D-054: the one in-cluster service-to-service hop, cleartext HTTP/2 on the internal network.
      Grpc__TaskFlowRead__Address: ${Grpc__TaskFlowRead__Address:-http://api:8081}
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  react:
    image: ${TASKFLOW_REACT_IMAGE}
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - taskflow

  uno:
    image: ${TASKFLOW_UNO_IMAGE}
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - taskflow

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - taskflow

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - taskflow

  # SeaweedFS exposes its S3-compatible endpoint only on the internal network. Caddy publishes the
  # browser-reachable S3 origin configured by Storage__S3__PublicServiceUrl.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${Storage__S3__AccessKeyId}
      AWS_SECRET_ACCESS_KEY: ${Storage__S3__SecretAccessKey}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - taskflow

  # Explicit NonAzure read-model alternative. It is never started unless `--profile mongo` is supplied
  # and ReadModel__Provider is changed to MongoDb with ConnectionStrings__MongoDb1 configured.
  mongo:
    image: mongo:8
    profiles: ["mongo"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - taskflow

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - taskflow

  # Grafana/Loki/Tempo/Mimir in one container. Bound to loopback: reachable over an ssh tunnel only,
  # never published to the internet (it has no authentication worth exposing).
  otel-lgtm:
    image: grafana/otel-lgtm:0.32.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - lgtm-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    networks:
      - taskflow

  # D-045 opt-in: `docker compose --profile pooler up -d`. Point the app connection strings at
  # pgbouncer:6432 and set Database__PostgreSql__PoolerMode=Transaction in .env when this runs.
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.25.2-p0}
    profiles: ["pooler"]
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${PGBOUNCER_HEALTH_USER:-pgbouncer} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - taskflow

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
  mongo-data:
  redis-data:
  lgtm-data:

networks:
  taskflow:
    driver: bridge
