# TaskFlow NonAzure lane - production stack for a single VPS (D-060, D-036).
#
# This file is the canonical NonAzure stack: PostgreSQL, RabbitMQ and SeaweedFS run beside the TaskFlow
# hosts. docker-compose.override.local.yml adds local image builds only, so CI validates the same topology.
#
# Images are digest-pinned by the deploy job, which writes deploy/compose/images.env on the VPS. The
# operator manages .env.base; the deploy job combines it with images.env into generated .env - see README.md.
#
# App containers are chiseled (no shell, no curl), so they carry no compose healthcheck on purpose. Caddy's
# active upstream health checks against /healthz/ready are what gate traffic, and the migrator's
# service_completed_successfully is what gates startup. See README.md "Why the app services have no healthcheck".

name: taskflow

x-nonazure-providers: &nonazure-providers
  Hosting__Lane: NonAzure
  Database__Provider: PostgreSql
  Messaging__Provider: RabbitMq
  Storage__Provider: S3
  ReadModel__Provider: ${ReadModel__Provider:-PostgreSqlJsonb}
  Audit__Provider: Relational
  Search__Provider: Sql
  AiServices__Provider: None
  DataProtection__Persistence: Redis

x-app-common: &app-common
  restart: unless-stopped
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    DOTNET_gcServer: "1"

services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # The only published ports in the stack. Everything else talks over scoped Compose networks.
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in .env.base}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.base}
      REACT_UI_DOMAIN: ${REACT_UI_DOMAIN:?set REACT_UI_DOMAIN in .env.base}
      UNO_UI_DOMAIN: ${UNO_UI_DOMAIN:?set UNO_UI_DOMAIN in .env.base}
      S3_PUBLIC_DOMAIN: ${S3_PUBLIC_DOMAIN:?set S3_PUBLIC_DOMAIN in .env.base}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - edge

  # Single migration owner (same rule as the AppHost): runs to completion, every app service waits for it.
  migrator:
    image: ${TASKFLOW_MIGRATOR_IMAGE}
    restart: "no"
    environment:
      Hosting__Lane: NonAzure
      Database__Provider: PostgreSql
      ASPNETCORE_ENVIRONMENT: Production
      Database__PostgreSql__PoolerMode: ${Database__PostgreSql__PoolerMode:-}
      ConnectionStrings__TaskFlowDbContextTrxn: ${ConnectionStrings__TaskFlowDbContextTrxn:?set TaskFlowDbContextTrxn in .env.base}
      ConnectionStrings__TaskFlowFlowEngineDbContext: ${ConnectionStrings__TaskFlowFlowEngineDbContext:?set TaskFlowFlowEngineDbContext in .env.base}
      ConnectionStrings__TickerQDbContext: ${ConnectionStrings__TickerQDbContext:?set TickerQDbContext in .env.base}
      Database__Encryption__LocalKeyBase64: ${Database__Encryption__LocalKeyBase64:?set LocalKeyBase64 in .env.base}
      Database__Encryption__BlindIndexKeyBase64: ${Database__Encryption__BlindIndexKeyBase64:?set BlindIndexKeyBase64 in .env.base}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${OPENOBSERVE_OTLP_BASIC_CREDENTIAL:?set OPENOBSERVE_OTLP_BASIC_CREDENTIAL in .env.base},organization=${OPENOBSERVE_ORGANIZATION:-default},stream-name=${OPENOBSERVE_STREAM_NAME:-taskflow}"
      OpenTelemetry__MetricsEnabled: ${OpenTelemetry__MetricsEnabled:-false}
      # D-064: below Compose's 10 s default stop grace, so hosted services finish before SIGKILL.
      Hosting__ShutdownTimeoutSeconds: ${Hosting__ShutdownTimeoutSeconds:-8}
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - data
      - telemetry

  api:
    <<: *app-common
    image: ${TASKFLOW_API_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      Cors__AllowedOrigins__0: ${BLAZOR_UI_ORIGIN:?set BLAZOR_UI_ORIGIN in .env.base}
      Cors__AllowedOrigins__1: ${REACT_UI_ORIGIN:?set REACT_UI_ORIGIN in .env.base}
      Cors__AllowedOrigins__2: ${UNO_UI_ORIGIN:?set UNO_UI_ORIGIN in .env.base}
      Database__PostgreSql__PoolerMode: ${Database__PostgreSql__PoolerMode:-}
      ConnectionStrings__TaskFlowDbContextTrxn: ${ConnectionStrings__TaskFlowDbContextTrxn:?set TaskFlowDbContextTrxn in .env.base}
      ConnectionStrings__TaskFlowDbContextQuery: ${ConnectionStrings__TaskFlowDbContextQuery:?set TaskFlowDbContextQuery in .env.base}
      ConnectionStrings__TaskFlowFlowEngineDbContext: ${ConnectionStrings__TaskFlowFlowEngineDbContext:?set TaskFlowFlowEngineDbContext in .env.base}
      ConnectionStrings__TickerQDbContext: ${ConnectionStrings__TickerQDbContext:?set TickerQDbContext in .env.base}
      ConnectionStrings__Redis1: ${ConnectionStrings__Redis1:?set Redis1 in .env.base}
      Messaging__RabbitMq__ConnectionString: ${Messaging__RabbitMq__ConnectionString:?set RabbitMq connection in .env.base}
      ConnectionStrings__RabbitMq1: ${ConnectionStrings__RabbitMq1:?set RabbitMq1 in .env.base}
      Storage__S3__ServiceUrl: ${Storage__S3__ServiceUrl:-http://seaweedfs:8333}
      Storage__S3__PublicServiceUrl: ${Storage__S3__PublicServiceUrl:?set S3 PublicServiceUrl in .env.base}
      Storage__S3__Region: ${Storage__S3__Region:?set S3 Region in .env.base}
      Storage__S3__AccessKeyId: ${Storage__S3__AccessKeyId:?set S3 AccessKeyId in .env.base}
      Storage__S3__SecretAccessKey: ${Storage__S3__SecretAccessKey:?set S3 SecretAccessKey in .env.base}
      Storage__S3__ForcePathStyle: ${Storage__S3__ForcePathStyle:-true}
      ConnectionStrings__MongoDb1: ${ConnectionStrings__MongoDb1:-}
      Database__Encryption__LocalKeyBase64: ${Database__Encryption__LocalKeyBase64:?set LocalKeyBase64 in .env.base}
      Database__Encryption__BlindIndexKeyBase64: ${Database__Encryption__BlindIndexKeyBase64:?set BlindIndexKeyBase64 in .env.base}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${OPENOBSERVE_OTLP_BASIC_CREDENTIAL:?set OPENOBSERVE_OTLP_BASIC_CREDENTIAL in .env.base},organization=${OPENOBSERVE_ORGANIZATION:-default},stream-name=${OPENOBSERVE_STREAM_NAME:-taskflow}"
      OpenTelemetry__MetricsEnabled: ${OpenTelemetry__MetricsEnabled:-false}
      # D-064: below Compose's 10 s default stop grace, so hosted services finish before SIGKILL.
      Hosting__ShutdownTimeoutSeconds: ${Hosting__ShutdownTimeoutSeconds:-8}
      # 8080 REST, 8081 cleartext HTTP/2 for the internal gRPC read service (D-054). Both come from the
      # image's own Kestrel:Endpoints section; nothing here overrides them.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - app
      - data
      - cache
      - telemetry

  gateway:
    <<: *app-common
    image: ${TASKFLOW_GATEWAY_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      ReverseProxy__Clusters__api-cluster__Destinations__api__Address: http://api:8080
      AggregateHealthCheck__TaskFlowApiHealthUrl: http://api:8080/health/full
      # Caddy terminates TLS, so the gateway must trust one hop of forwarded headers to see the real scheme.
      Proxy__ForwardedHeaders__Enabled: "true"
      Proxy__ForwardedHeaders__ForwardLimit: "1"
      CorsSettings__AllowedOrigins__0: ${BLAZOR_UI_ORIGIN:?set BLAZOR_UI_ORIGIN in .env.base}
      CorsSettings__AllowedOrigins__1: ${REACT_UI_ORIGIN:?set REACT_UI_ORIGIN in .env.base}
      CorsSettings__AllowedOrigins__2: ${UNO_UI_ORIGIN:?set UNO_UI_ORIGIN in .env.base}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${OPENOBSERVE_OTLP_BASIC_CREDENTIAL:?set OPENOBSERVE_OTLP_BASIC_CREDENTIAL in .env.base},organization=${OPENOBSERVE_ORGANIZATION:-default},stream-name=${OPENOBSERVE_STREAM_NAME:-taskflow}"
      OpenTelemetry__MetricsEnabled: ${OpenTelemetry__MetricsEnabled:-false}
      # D-064: below Compose's 10 s default stop grace, so hosted services finish before SIGKILL.
      Hosting__ShutdownTimeoutSeconds: ${Hosting__ShutdownTimeoutSeconds:-8}
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    networks:
      - edge
      - app
      - telemetry

  scheduler:
    <<: *app-common
    image: ${TASKFLOW_SCHEDULER_IMAGE}
    environment:
      <<: *nonazure-providers
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      Database__PostgreSql__PoolerMode: ${Database__PostgreSql__PoolerMode:-}
      ConnectionStrings__TaskFlowDbContextTrxn: ${ConnectionStrings__TaskFlowDbContextTrxn:?set TaskFlowDbContextTrxn in .env.base}
      ConnectionStrings__TaskFlowDbContextQuery: ${ConnectionStrings__TaskFlowDbContextQuery:?set TaskFlowDbContextQuery in .env.base}
      ConnectionStrings__TaskFlowFlowEngineDbContext: ${ConnectionStrings__TaskFlowFlowEngineDbContext:?set TaskFlowFlowEngineDbContext in .env.base}
      ConnectionStrings__TickerQDbContext: ${ConnectionStrings__TickerQDbContext:?set TickerQDbContext in .env.base}
      ConnectionStrings__Redis1: ${ConnectionStrings__Redis1:?set Redis1 in .env.base}
      Messaging__RabbitMq__ConnectionString: ${Messaging__RabbitMq__ConnectionString:?set RabbitMq connection in .env.base}
      ConnectionStrings__RabbitMq1: ${ConnectionStrings__RabbitMq1:?set RabbitMq1 in .env.base}
      Storage__S3__ServiceUrl: ${Storage__S3__ServiceUrl:-http://seaweedfs:8333}
      Storage__S3__PublicServiceUrl: ${Storage__S3__PublicServiceUrl:?set S3 PublicServiceUrl in .env.base}
      Storage__S3__Region: ${Storage__S3__Region:?set S3 Region in .env.base}
      Storage__S3__AccessKeyId: ${Storage__S3__AccessKeyId:?set S3 AccessKeyId in .env.base}
      Storage__S3__SecretAccessKey: ${Storage__S3__SecretAccessKey:?set S3 SecretAccessKey in .env.base}
      Storage__S3__ForcePathStyle: ${Storage__S3__ForcePathStyle:-true}
      ConnectionStrings__MongoDb1: ${ConnectionStrings__MongoDb1:-}
      Database__Encryption__LocalKeyBase64: ${Database__Encryption__LocalKeyBase64:?set LocalKeyBase64 in .env.base}
      Database__Encryption__BlindIndexKeyBase64: ${Database__Encryption__BlindIndexKeyBase64:?set BlindIndexKeyBase64 in .env.base}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${OPENOBSERVE_OTLP_BASIC_CREDENTIAL:?set OPENOBSERVE_OTLP_BASIC_CREDENTIAL in .env.base},organization=${OPENOBSERVE_ORGANIZATION:-default},stream-name=${OPENOBSERVE_STREAM_NAME:-taskflow}"
      OpenTelemetry__MetricsEnabled: ${OpenTelemetry__MetricsEnabled:-false}
      # D-064: below Compose's 10 s default stop grace, so hosted services finish before SIGKILL.
      Hosting__ShutdownTimeoutSeconds: ${Hosting__ShutdownTimeoutSeconds:-8}
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    networks:
      - data
      - cache
      - telemetry

  blazor:
    <<: *app-common
    image: ${TASKFLOW_BLAZOR_IMAGE}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_gcServer: "1"
      # Gateway__BaseUrl comes from operator-managed .env.base through generated .env: it is the public origin a browser talks to (https://<domain>
      # on the VPS, http://gateway:8080 in the CI smoke), so it is not derivable from CADDY_DOMAIN alone.
      # D-054: the one in-cluster service-to-service hop, cleartext HTTP/2 on the internal network.
      Grpc__TaskFlowRead__Address: ${Grpc__TaskFlowRead__Address:-http://api:8081}
      Gateway__BaseUrl: ${Gateway__BaseUrl:?set Gateway BaseUrl in .env.base}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5081
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_HEADERS: "Authorization=Basic ${OPENOBSERVE_OTLP_BASIC_CREDENTIAL:?set OPENOBSERVE_OTLP_BASIC_CREDENTIAL in .env.base},organization=${OPENOBSERVE_ORGANIZATION:-default},stream-name=${OPENOBSERVE_STREAM_NAME:-taskflow}"
      OpenTelemetry__MetricsEnabled: ${OpenTelemetry__MetricsEnabled:-false}
      # D-064: below Compose's 10 s default stop grace, so hosted services finish before SIGKILL.
      Hosting__ShutdownTimeoutSeconds: ${Hosting__ShutdownTimeoutSeconds:-8}
    depends_on:
      api:
        condition: service_started
      gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    networks:
      - edge
      - app
      - telemetry

  react:
    image: ${TASKFLOW_REACT_IMAGE}
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?set GATEWAY_BASE_URL in .env.base}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - edge

  uno:
    image: ${TASKFLOW_UNO_IMAGE}
    restart: unless-stopped
    environment:
      GATEWAY_BASE_URL: ${GATEWAY_BASE_URL:?set GATEWAY_BASE_URL in .env.base}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - edge

  postgres:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.base}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.base}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.base}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:5935b8b172f3351664b7f1610a109b3c883cec000bebeeca894d1719d18ffc76
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env.base}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env.base}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - data

  # SeaweedFS exposes its S3-compatible endpoint only on the internal network. Caddy publishes the
  # browser-reachable S3 origin configured by Storage__S3__PublicServiceUrl.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${Storage__S3__AccessKeyId:?set S3 AccessKeyId in .env.base}
      AWS_SECRET_ACCESS_KEY: ${Storage__S3__SecretAccessKey:?set S3 SecretAccessKey in .env.base}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - edge
      - data

  # Explicit NonAzure read-model alternative. It is never started unless `--profile mongo` is supplied
  # and ReadModel__Provider is changed to MongoDb with ConnectionStrings__MongoDb1 configured.
  mongo:
    image: mongo:8.3.11@sha256:2609aaf7a1abbff404101af896e05f243d22be742471ed857b50b9ce0270fdbd
    profiles: ["mongo"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set MONGO_INITDB_ROOT_USERNAME in .env.base}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set MONGO_INITDB_ROOT_PASSWORD in .env.base}
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

  redis:
    image: redis:8.8.2@sha256:37227fff5638322f4ebea25d6d0dc3ee50848604e82b81426f11507b3ec7d2cc
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.base}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.base}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - cache

  # D-061 deployed NonAzure observability. The UI is reachable only through an SSH tunnel; OTLP gRPC
  # remains internal on the telemetry network. v1.0.0 has no image healthcheck or shell utility, so a
  # Compose probe would be synthetic and unreliable.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.0@sha256:d581789cb03b5f061ed56a3e864b5e4bbc86bbf6d317ec863372e98ee49b30d5
    restart: unless-stopped
    environment:
      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?set OPENOBSERVE_ROOT_EMAIL in .env.base}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?set OPENOBSERVE_ROOT_PASSWORD in .env.base}
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OPENOBSERVE_RETENTION_DAYS:-14}
      ZO_COMPACT_FAST_MODE: "false"
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve-data:/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    networks:
      - telemetry

  # D-045 opt-in: `docker compose --profile pooler up -d`. Point the app connection strings at
  # pgbouncer:6432 and set Database__PostgreSql__PoolerMode=Transaction in .env.base when this runs.
  pgbouncer:
    image: ${PGBOUNCER_IMAGE:-edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340}
    profiles: ["pooler"]
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${PGBOUNCER_HEALTH_USER:-pgbouncer} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - data

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
  mongo-data:
  redis-data:
  openobserve-data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  cache:
    driver: bridge
    internal: true
  telemetry:
    driver: bridge
    internal: true
