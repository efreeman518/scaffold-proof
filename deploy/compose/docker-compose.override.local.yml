# Local / CI overlay for the NonAzure lane stack.
#
# Builds app images from the repo Dockerfiles instead of pulling deployment digests. Infrastructure services
# remain in docker-compose.yml so CI validates the same PostgreSQL, RabbitMQ and SeaweedFS topology as a VPS.
# Everything here is under the `local` profile, so a bare combined config stays valid without selecting local
# image builds.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.local.yml --profile local up -d --wait
#
# Credentials below are dev-only, hard-coded on purpose so CI needs no secret for them. They are not, and
# must never become, real credentials.

services:
  caddy:
    profiles: ["local"]
    # Plain :80, no ACME: a CI runner has no public DNS name to answer an ACME challenge with.
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  redis:
    profiles: ["local"]

  # Local development uses the Aspire Dashboard. Keep the deployed observability backend outside the
  # local/CI profile and explicitly disable app exporters so an absent backend produces no connection noise.
  openobserve:
    profiles: ["deployment-observability"]

  migrator:
    profiles: ["local"]
    image: taskflow-db-migrator:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    build: &nuget-build
      context: ../..
      dockerfile: src/Host/TaskFlow.DatabaseMigrator/Dockerfile
      secrets:
        - nuget_credentials
  api:
    profiles: ["local"]
    image: taskflow-api:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    build:
      <<: *nuget-build
      dockerfile: src/Host/TaskFlow.Api/Dockerfile
  gateway:
    profiles: ["local"]
    image: taskflow-gateway:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    build:
      <<: *nuget-build
      dockerfile: src/Host/TaskFlow.Gateway/Dockerfile

  scheduler:
    profiles: ["local"]
    image: taskflow-scheduler:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    build:
      <<: *nuget-build
      dockerfile: src/Host/TaskFlow.Scheduler/Dockerfile
  blazor:
    profiles: ["local"]
    image: taskflow-blazor:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_EXPORTER_OTLP_HEADERS: ""
    build:
      <<: *nuget-build
      dockerfile: src/UI/TaskFlow.Blazor/Dockerfile

  react:
    profiles: ["local"]
    image: taskflow-react:local
    build:
      context: ../..
      dockerfile: src/UI/TaskFlow.React/Dockerfile

  uno:
    profiles: ["local"]
    image: taskflow-uno:local
    build:
      <<: *nuget-build
      dockerfile: src/UI/TaskFlow.Uno/Dockerfile

secrets:
  # Same BuildKit secret the deploy image build uses: the private EF.* feed credential never becomes a
  # build arg or an image layer.
  nuget_credentials:
    environment: NuGetPackageSourceCredentials_efreeman518-github
