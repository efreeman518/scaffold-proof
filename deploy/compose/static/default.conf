server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /app-config.json {
        alias /var/cache/nginx/app-config/app-config.json;
        add_header Cache-Control "no-store" always;
    }

    # The shell is revalidated on every load, so a redeploy is picked up instead of a heuristically cached
    # index requesting fingerprinted files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # A path with a file extension is an asset: missing means 404, never the SPA shell served as HTML (which
    # the WASM bootstrap would fail to parse). Extensionless paths below are client routes.
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
