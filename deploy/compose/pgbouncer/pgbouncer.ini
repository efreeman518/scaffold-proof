; PgBouncer for the Portable lane (D-045).
;
; Transaction pooling is the mode that actually raises the ceiling: a server connection is held only for the
; duration of a transaction, so hundreds of idle app connections map onto a small server pool. The cost is
; that session state does not survive - no session-level prepared statements, no SET, no LISTEN/NOTIFY. The
; app side of that bargain is Database__PostgreSql__PoolerMode=Transaction, which appends
; "No Reset On Close=true;Max Auto Prepare=0" to the Npgsql string. Run one without the other and you get
; either "prepared statement already exists" errors or a pool that resets on every checkout.

[databases]
taskflowdb = host=postgres port=5432 dbname=taskflowdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

; Client side is generous (the apps pool locally too); server side is what protects Postgres.
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_reset_query =
server_reset_query_always = 0

; Npgsql sends extra_float_digits and options on connect; in transaction mode PgBouncer must be told to
; ignore them rather than refuse the connection.
ignore_startup_parameters = extra_float_digits,options

server_lifetime = 3600
server_idle_timeout = 600
query_wait_timeout = 30

log_connections = 0
log_disconnections = 0
stats_period = 60
